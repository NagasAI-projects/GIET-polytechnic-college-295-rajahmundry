<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask sAI Chatbot</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:transparent;
}
#ask-sai-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 150px;
    height: 170px;
    cursor: pointer;
}

/* 🔥 Circle Icon */
.circle-icon {
    position: absolute;
    bottom: 20px;
    left: -25px;
    width: 100px;
    height: 100px;
    border-radius: 50%;
}

/* 🔥 Bubble Image (Exact Overlay) */
.ask-bubble {
    position: absolute;
    top: -30px;

    right: -25px;
    width: 140px;
    z-index: 2;
}

/* ================= FLOATING ICON ================= */

#ask-sai-widget{
  position:fixed;
  bottom:20px;
  right:20px;
  cursor:pointer;
  animation:pulse 5s infinite;
  z-index:2147483647;
}

.ask-avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  border:6px solid #3aa86d;
  background:#3aa86d;
  object-fit:cover;
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.ask-tag{
  position:absolute;
  top:-40px;
  right:-10px;
  background:#f7b500;
  color:#000;
  font-weight:700;
  font-size:14px;
  padding:6px 12px;
  border-radius:6px;
}

.ask-tag::after{
  content:"";
  position:absolute;
  bottom:-8px;
  right:25px;
  border-width:8px;
  border-style:solid;
  border-color:#f7b500 transparent transparent transparent;
}

@keyframes pulse{
  0%{ transform:scale(1); }
  70%{ transform:scale(0.8); }
  100%{ transform:scale(1.05); }
  
}
/* ================= CHAT WINDOW ================= */
#chat-container{
  position: fixed;
  bottom: 100px;
  right: 20px;
 height: 70vh;
 max-height: 500px; 
  width:100px;
  background: #f4f6fb;
  border-radius: 15px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.2);
  display: none;
  flex-direction: column;
  overflow: hidden;
}
.chat-header{
  background:linear-gradient(135deg,#6a11cb,#2575fc);
  color:#fff;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-shrink:0;
  height: 55px;
}

.chat-body{
  flex:1;
  padding:10px;
  overflow-y:auto;
  background:#f8fafc;
}

.user{
  background:#2575fc;
  color:#fff;
  padding:8px 12px;
  border-radius:14px 14px 4px 14px;
  margin:6px 0;
  max-width:80%;
  margin-left:auto;
}

.bot{
  background:#e5e7eb;
  padding:8px 12px;
  border-radius:14px 14px 14px 4px;
  margin:6px 0;
  max-width:80%;
}

.chat-input{
  display:flex;
  border-top:1px solid #eee;
}

.chat-input input{
  flex:1;
  padding:10px;
  border:none;
  outline:none;
}

.chat-input button{
  background:#2575fc;
  color:#fff;
  border:none;
  padding:10px 14px;
  cursor:pointer;
}

/* Suggestions */
.suggestions{
  margin-top:10px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.suggestions button{
  background:#eef2ff;
  border:1px solid #c7d2fe;
  padding:6px 10px;
  border-radius:20px;
  cursor:pointer;
  font-size:12px;
}

.suggestions button:hover{
  background:#dbeafe;
}
</style>
</head>
<body>

<!-- ================= CHAT WINDOW ================= -->

<div id="chat-container">
  <div class="chat-header">
    <b>Ask sAI</b>
    <span onclick="toggleChat()" style="cursor:pointer;">✖</span>
  </div>

  <div class="chat-body" id="chatBody">

    <div class="bot">Hello 👋 How can I help you?</div>

    <div class="suggestions" id="suggestionsBox">
      <button onclick="quickAsk('syllabus pdfs')">Syllabus PDFs</button>
      <button onclick="quickAsk('notes')">Notes</button>
      <button onclick="quickAsk('timetable')">Timetable</button>
      <button onclick="quickAsk('previous papers')">Previous Papers</button>
      <button onclick="quickAsk('about giet')">About GIET</button>
      <button onclick="quickAsk('departments')">Departments</button>
      <button onclick="quickAsk('admissions')">Admissions</button>
      <button onclick="quickAsk('ecet')">ECET</button>
      <button onclick="quickAsk('contact')">Contact</button>
      <button onclick="quickAsk('website home')">Website Home</button>
    </div>

  </div>

  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Type a message...">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- ================= FLOATING ICON ================= -->

<div id="ask-sai-widget" onclick="toggleChat()">
   <!-- ASK sAI Bubble -->
    <img src="ask sai.png" class="ask-bubble" alt="Ask sAI">

    <!-- Circle Icon -->
    <img src="boticon.png" class="circle-icon" alt="Assistant">

</div>

/* 🔥 ENTER KEY SEND */
document.addEventListener("DOMContentLoaded", function(){
  const input = document.getElementById("userInput");
  if(input){
    input.addEventListener("keypress", function(e){
      if(e.key === "Enter"){
        e.preventDefault();
        sendMessage();
      }
    });
  }
});

/* ================= CHAT LOGIC ================= */

function toggleChat(){
  const chat = document.getElementById("chat-container");
  const widget = document.getElementById("ask-sai-widget");

  if(chat.style.display === "flex"){
    chat.style.display = "none";
    widget.style.display = "block";
  } else {
    chat.style.display = "flex";
    widget.style.display = "none";
  }
}

function quickAsk(text){
  const suggestions = document.getElementById("suggestionsBox");
  if(suggestions) suggestions.style.display = "none";
  addMessage(text);
}

function sendMessage(){
  const input = document.getElementById("userInput");
  const msg = input.value.trim();
  if(msg === "") return;
  addMessage(msg);
  input.value = "";
}

function addMessage(msg){
  smoothScroll();
/* 🔥 SMOOTH AUTO SCROLL FUNCTION */
function smoothScroll(){
  const chatBody = document.getElementById("chatBody");
  chatBody.scrollTo({
    top: chatBody.scrollHeight,
    behavior: "smooth"
  });
}


  // Show user message
  const userDiv = document.createElement("div");
  userDiv.className = "user";
  userDiv.innerText = msg;
  chatBody.appendChild(userDiv);

  // Smart reply matching
  let message = msg.toLowerCase();
  let reply = "Sorry, I didn't understand 🤔";

  for(let key in replies){
    if(message.includes(key)){
      reply = replies[key];
      break;
    }
  }

  // 🔥 Typing indicator
const typingDiv = document.createElement("div");
typingDiv.className = "bot";
typingDiv.innerText = "Typing...";
chatBody.appendChild(typingDiv);
smoothScroll();

setTimeout(() => {
  typingDiv.remove();

  const botDiv = document.createElement("div");
  botDiv.className = "bot";
  botDiv.innerText = reply;
  chatBody.appendChild(botDiv);

  smoothScroll();

}, 800);


  chatBody.scrollTop = chatBody.scrollHeight;
}

</script>
